<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// Links: https://beequation.com/get/kids/?c=tiktok-daily
//        https://beequation.com/get/pro/?c=x-daily&m=social
// Launch-day configuration: ios is the numeric App Store ID, filled in at launch.
const STORES = { kids: { ios: '', android: 'com.trettlabs.beequationkids' }, pro: { ios: '', android: 'com.trettlabs.beequation' } };
const LIVE = { ios: false, android: false }; // Set true when that store page is live.
const APPLE_PT = ''; // App Store Connect campaign provider token.

const query = new URLSearchParams(location.search);
const pathApp = location.pathname.match(/^\/get\/(kids|pro)\/?$/);
const app = pathApp ? pathApp[1] : query.get('app') === 'pro' ? 'pro' : 'kids';
const valid = /^[a-z0-9-]{1,40}$/;
const c = valid.test(query.get('c') || '') ? query.get('c') : 'direct';
const m = valid.test(query.get('m') || '') ? query.get('m') : 'link';
const source = c.split('-')[0];
const enc = encodeURIComponent;
const ua = navigator.userAgent;
const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
const android = /Android/i.test(ua);
let target;

if (ios && LIVE.ios && STORES[app].ios) {
  target = 'https://apps.apple.com/app/id' + enc(STORES[app].ios) + '?mt=8&ct=' + enc(c);
  if (APPLE_PT) target += '&pt=' + enc(APPLE_PT);
} else if (android && LIVE.android) {
  const referrer = 'utm_source=' + enc(source) + '&utm_medium=' + enc(m) + '&utm_campaign=' + enc(c);
  target = 'https://play.google.com/store/apps/details?id=' + enc(STORES[app].android) + '&referrer=' + enc(referrer);
} else {
  let code = ((navigator.languages || [])[0] || navigator.language || '').slice(0, 2).toLowerCase();
  if (code === 'nb' || code === 'nn') code = 'no';
  const languages = ['fr', 'es', 'de', 'pt', 'it', 'nl', 'pl', 'sv', 'da', 'no', 'fi', 'tr', 'ja', 'ko'];
  const base = 'https://' + (languages.includes(code) ? enc(code) + '.' : '') + 'beequation.com';
  const utm = 'utm_source=' + enc(source) + '&utm_medium=' + enc(m) + '&utm_campaign=' + enc(c);
  target = !ios && !android && LIVE.ios && LIVE.android
    ? base + '/?' + utm + '#apps'
    : base + '/play.html?app=' + enc(app) + '&' + utm;
}
location.replace(target);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Beequation</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">

body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; background: #12161F; color: #F2F4F8; font-family: system-ui, sans-serif; }
a { color: inherit; }
</style>
<noscript><meta http-equiv="refresh" content="3;url=https://beequation.com/play.html"></noscript>
</head>

</body>
</html>
